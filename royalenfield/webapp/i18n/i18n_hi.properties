m1p1 = हमेशा लोकप्रिय रही क्लासिक 350 का बॉबर संस्करण काफी आकर्षक दिखता है और इसका डिजाइन इसका सबसे बड़ा आकर्षण है।
m1p2 = रॉयल एनफील्ड गोअन क्लासिक 350 कुछ ही दिनों में भारत में लॉन्च होने वाली है। रॉयल एनफील्ड 23 नवंबर को मोटोवर्स 2024 में बाइक का अनावरण करने के बाद इसकी कीमतों की घोषणा करेगी।
m2p1 = कीमत: रॉयल एनफील्ड बियर 650 के इसके वेरिएंट - बियर 650 ब्रॉडवॉक व्हाइट की कीमत 3,39,000 रुपये से शुरू होती है। अन्य वेरिएंट - बियर 650 पेट्रोल ग्रीन और वाइल्ड हनी, बियर 650 गोल्डन शैडो और बियर 650 टू फोर नाइन की कीमत क्रमशः 3,44,000 रुपये, 3,51,000 रुपये और 3,59,000 रुपये है। बताई गई बियर 650 की कीमतें औसत एक्स-शोरूम हैं।
m2p2 = रॉयल एनफील्ड ने अपनी नई बाइक बेयर 650 की डिलीवरी पूरे भारत में शुरू कर दी है। इंटरसेप्टर 650 का स्क्रैम्बलर वर्जन 5 नवंबर को लॉन्च किया गया था। 
m3p1 = नई क्लासिक 350 ने चीजों को बिल्कुल नए स्तर पर पहुंचा दिया है। अब यह बहुत बेहतर दिखती है। इंजन अच्छा प्रदर्शन करता है और चरित्र को बरकरार रखता है। यह अच्छी तरह से हैंडल करता है और शहर के साथ-साथ हाईवे पर भी एक अच्छा राइडिंग अनुभव देता है। लेकिन राइड क्वालिटी थोड़ी सख्त है जो शहर में राइडिंग में समस्या साबित हो सकती है। साथ ही, कीमतों में भी काफी वृद्धि हुई है।
m3p2 = कीमत: रॉयल एनफील्ड क्लासिक 350 के वैरिएंट - क्लासिक 350 हेरिटेज की कीमत 1,99,499 रुपये से शुरू होती है। अन्य वैरिएंट - क्लासिक 350 हेरिटेज प्रीमियम, क्लासिक 350 सिग्नल, क्लासिक 350 डार्क और क्लासिक 350 क्रोम की कीमत क्रमशः 2,03,992 रुपये, 2,16,000 रुपये, 2,25,000 रुपये और 2,30,000 रुपये है। बताई गई क्लासिक 350 की कीमतें औसत एक्स-शोरूम हैं।
m4p1 = रॉयल एनफील्ड गुरिल्ला 450 3 वेरिएंट और 5 रंगों में उपलब्ध बाइक है। रॉयल एनफील्ड गुरिल्ला 450 में 452cc BS6 इंजन है जो 39.47 bhp की पावर और 40 Nm का टॉर्क देता है। फ्रंट और रियर दोनों डिस्क ब्रेक के साथ, रॉयल एनफील्ड गुरिल्ला 450 एंटी-लॉकिंग ब्रेकिंग सिस्टम के साथ आता है। इस गुरिल्ला 450 बाइक का वजन 185 किलोग्राम है और इसकी फ्यूल टैंक क्षमता 11 लीटर है।
m4p2 = कीमत: रॉयल एनफील्ड गुरिल्ला 450 के वैरिएंट - गुरिल्ला 450 एनालॉग की कीमत 2,39,000 रुपये से शुरू होती है। अन्य वैरिएंट - गुरिल्ला 450 डैश और गुरिल्ला 450 फ्लैश की कीमत 2,49,000 रुपये और 2,54,000 रुपये है। बताई गई गुरिल्ला 450 की कीमतें औसत एक्स-शोरूम हैं।
m5p1 = रॉयल एनफील्ड शॉटगन 650 एक क्रूजर बाइक है जो 3 वेरिएंट और 4 रंगों में उपलब्ध है। रॉयल एनफील्ड शॉटगन 650 में 648cc BS6 इंजन है जो 46.39 bhp की पावर और 52.3 Nm का टॉर्क देता है। फ्रंट और रियर दोनों डिस्क ब्रेक के साथ, रॉयल एनफील्ड शॉटगन 650 एंटी-लॉकिंग ब्रेकिंग सिस्टम के साथ आती है। इस शॉटगन 650 बाइक का वजन 240 किलोग्राम है और इसकी फ्यूल टैंक क्षमता 13.8 लीटर है।
m5p2 = कीमत: रॉयल एनफील्ड शॉटगन 650 के इसके वेरिएंट - शॉटगन 650 कस्टम शेड की कीमत 3,59,430 रुपये से शुरू होती है। अन्य वेरिएंट - शॉटगन 650 कस्टम प्रो और शॉटगन 650 कस्टम स्पेशल की कीमत 3,70,138 रुपये और 3,73,000 रुपये है। बताई गई शॉटगन 650 की कीमतें औसत एक्स-शोरूम हैं।
m6p1 = हिमालयन 452, हिमालयन 411 का उत्तराधिकारी है और अपनी बेहतरीन ऑफ-रोड क्षमताओं के साथ-साथ शानदार सड़क व्यवहार के लिए जाना जाता है। इसमें गूगल मैप्स इंटीग्रेशन के साथ एक पूर्ण रंगीन TFT स्क्रीन भी है। लेकिन बाइक में ट्यूबलेस स्पोक व्हील्स नहीं हैं और इसमें कुछ गुणवत्ता संबंधी समस्याएं भी हैं।
m6p2 = कीमत: रॉयल एनफील्ड हिमालयन 450 के इसके वेरिएंट - हिमालयन 450 बेस की कीमत 2,85,000 रुपये से शुरू होती है। अन्य वेरिएंट - हिमालयन 450 पास, हिमालयन 450 समिट और हिमालयन 450 हनले ब्लैक की कीमत 2,89,000 रुपये, 2,93,000 रुपये और 2,98,000 रुपये है। बताई गई हिमालयन 450 की कीमतें औसत एक्स-शोरूम हैं।
m7p1 = रॉयल एनफील्ड बुलेट 350 एक स्ट्रीट बाइक है जो 5 वेरिएंट और 7 रंगों में उपलब्ध है। रॉयल एनफील्ड बुलेट 350 में 349cc BS6 इंजन है जो 20.2 bhp की पावर और 27 Nm का टॉर्क देता है। फ्रंट डिस्क और रियर ड्रम ब्रेक के साथ, रॉयल एनफील्ड बुलेट 350 एंटी-लॉकिंग ब्रेकिंग सिस्टम के साथ आती है। इस बुलेट 350 बाइक का वजन 195 किलोग्राम है और इसकी फ्यूल टैंक क्षमता 13 लीटर है।
m7p2 = कीमत: रॉयल एनफील्ड बुलेट 350 के इसके वेरिएंट - बुलेट 350 बेस की कीमत 1,73,562 रुपये से शुरू होती है। अन्य वेरिएंट - बुलेट 350 बटालियन ब्लैक, बुलेट 350 मिलिट्री सिल्वर, बुलेट 350 मिड और बुलेट 350 टॉप की कीमत 1,74,875 रुपये, 1,79,000 रुपये, 1,97,436 रुपये और 2,15,801 रुपये है। बताई गई बुलेट 350 की कीमतें औसत एक्स-शोरूम हैं।
m8p1 = सुपर मेट्योर 650 एक बेहतरीन क्रूजर है जिसमें बेहतरीन स्टाइलिंग, बेहतरीन आराम और बेहतरीन प्रदर्शन करने वाला इंजन है। इसमें कुछ आधुनिक फीचर्स भी हैं। वास्तव में, इस बाइक में एलईडी हेडलाइट है। हालाँकि, अपनी क्रूजर प्रकृति के कारण, बाइक भारी है और इसकी सवारी की गुणवत्ता भी अच्छी नहीं है।
m8p2 = कीमत: रॉयल एनफील्ड सुपर मेट्योर 650 के इसके वेरिएंट - सुपर मेट्योर 650 एस्ट्रल की कीमत 3,63,900 रुपये से शुरू होती है। अन्य वेरिएंट - सुपर मेट्योर 650 इंटरस्टेलर और सुपर मेट्योर 650 सेलेस्टियल की कीमत 3,79,123 रुपये और 3,94,347 रुपये है। सुपर मेट्योर 650 की बताई गई कीमतें एक्स-शोरूम की औसत कीमतें हैं।
m9p1 = हंटर 350 एक अच्छी दिखने वाली मोटरसाइकिल है। इसमें एक ऐसा इंजन है जो अच्छा प्रदर्शन करता है लेकिन इसकी कठोर सवारी गुणवत्ता इसे थोड़ा परेशान करती है। सुविधाओं के मामले में, हंटर में बुनियादी सुविधाएँ हैं और जीपीएस गायब है। लेकिन इसकी उच्च आकांक्षात्मक कीमत और सुलभ सीट की ऊँचाई निश्चित रूप से इसे आकर्षक बनाती है।
m9p2 = कीमत: रॉयल एनफील्ड हंटर 350 के इसके वेरिएंट - हंटर 350 रेट्रो फैक्ट्री की कीमत 1,49,900 रुपये से शुरू होती है। अन्य वेरिएंट - हंटर 350 मेट्रो डैपर और हंटर 350 मेट्रो रेबेल की कीमत 1,69,434 रुपये और 1,74,430 रुपये है। हंटर 350 की बताई गई कीमतें औसत एक्स-शोरूम हैं।

