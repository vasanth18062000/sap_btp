tey = जब 1901 में पहली रॉयल एनफील्ड मोटरसाइकिल बाजार में आई, तो यह एक ऐसी प्यारी कहानी की शुरुआत थी जो सदी के अंत तक एक किंवदंती बन गई। सही मायने में नाम दिया गया - मेड लाइक अ गन - यह मुहावरा सरल, लचीली और भरोसेमंद मशीनों का प्रतीक है जो समय और इलाके की कसौटी पर खरी उतरी हैं। यह रॉयल एनफील्ड द्वारा बनाए जाने वाले हर उत्पाद के लिए एक प्रमुख प्रेरणा बनी हुई है।
