m1p1 = The bobber version of the ever-popular Classic 350 looks quite appealing and its design is one of its biggest draws.
m1p2 = The Royal Enfield Goan Classic 350 is set to be launched in India in a few days. Royal Enfield will announce the prices on 23 November after unveiling the bike at Motoverse 2024.
m2p1 = Price: Royal Enfield Bear 650 price for its variant - Bear 650 Broadwalk White starts at Rs. 3,39,000. The price for the other variants - Bear 650 Petrol Green and Wild Honey, Bear 650 Golden Shadow and Bear 650 Two Four Nine are Rs. 3,44,000, Rs. 3,51,000 and Rs. 3,59,000. The mentioned Bear 650 prices are the average ex-showroom.
m2p2 = Royal Enfield has commenced the deliveries of one of its newest offerings, the Bear 650 across India. The scrambler version of the Interceptor 650 was launched on 5 November. 
m3p1 = The new Classic 350 has taken things to a whole new level. It looks so much better now. The engine churns out good performance and retains the character. It handles well and manages to give out a nice city as well as highway riding experience. But the ride quality is a bit on the stiffer side that could prove an issue in city riding. Plus, the prices have increased quite a bit.
m3p2 = Price: Royal Enfield Classic 350 price for its variant - Classic 350 Heritage starts at Rs. 1,99,499. The price for the other variants - Classic 350 Heritage Premium, Classic 350 Signals, Classic 350 Dark and Classic 350 Chrome are Rs. 2,03,992, Rs. 2,16,000, Rs. 2,25,000 and Rs. 2,30,000. The mentioned Classic 350 prices are the average ex-showroom.
m4p1 = Royal Enfield Guerrilla 450 is a bike available in 3 variants and 5 colours. The Royal Enfield Guerrilla 450 is powered by 452cc BS6 engine which develops a power of 39.47 bhp and a torque of 40 Nm. With both front and rear disc brakes, Royal Enfield Guerrilla 450 comes up with anti-locking braking system. This Guerrilla 450 bike weighs 185 kg and has a fuel tank capacity of 11 liters.
m4p2 = Price: Royal Enfield Guerrilla 450 price for its variant - Guerrilla 450 Analogue starts at Rs. 2,39,000. The price for the other variants - Guerrilla 450 Dash and Guerrilla 450 Flash are Rs. 2,49,000 and Rs. 2,54,000. The mentioned Guerrilla 450 prices are the average ex-showroom.
m5p1 = Royal Enfield Shotgun 650 is a cruiser bike available in 3 variants and 4 colours. The Royal Enfield Shotgun 650 is powered by 648cc BS6 engine which develops a power of 46.39 bhp and a torque of 52.3 Nm. With both front and rear disc brakes, Royal Enfield Shotgun 650 comes up with anti-locking braking system. This Shotgun 650 bike weighs 240 kg and has a fuel tank capacity of 13.8 liters.
m5p2 = Price: Royal Enfield Shotgun 650 price for its variant - Shotgun 650 Custom Shed starts at Rs. 3,59,430. The price for the other variants - Shotgun 650 Custom Pro and Shotgun 650 Custom Special are Rs. 3,70,138 and Rs. 3,73,000. The mentioned Shotgun 650 prices are the average ex-showroom.
m6p1 = The Himalayan 452 is a successor of the Himalayan 411 and is known for its excellent off-road capabilities along with fantastic road manners. It also gets a full colour TFT screen with Google maps integration. But the bike misses out on tubeless spoke wheels and also has some quality issues.
m6p2 = Price: Royal Enfield Himalayan 450 price for its variant - Himalayan 450 Base starts at Rs. 2,85,000. The price for the other variants - Himalayan 450 Pass, Himalayan 450 Summit and Himalayan 450 Hanle Black are Rs. 2,89,000, Rs. 2,93,000 and Rs. 2,98,000. The mentioned Himalayan 450 prices are the average ex-showroom.
m7p1 = Royal Enfield Bullet 350 is a street bike available in 5 variants and 7 colours. The Royal Enfield Bullet 350 is powered by 349cc BS6 engine which develops a power of 20.2 bhp and a torque of 27 Nm. With front disc and rear drum brakes, Royal Enfield Bullet 350 comes up with anti-locking braking system. This Bullet 350 bike weighs 195 kg and has a fuel tank capacity of 13 liters.
m7p2 = Price: Royal Enfield Bullet 350 price for its variant - Bullet 350 Base starts at Rs. 1,73,562. The price for the other variants - Bullet 350 Battalion Black, Bullet 350 Military Silver, Bullet 350 Mid and Bullet 350 Top are Rs. 1,74,875, Rs. 1,79,000, Rs. 1,97,436 and Rs. 2,15,801. The mentioned Bullet 350 prices are the average ex-showroom.
m8p1 = The Super Meteor 650 is a proper cruiser that gets great aspirational styling, good comfort level and an engine that churns out great performance. It is loaded with some modern features too. In fact, this bike gets an LED headlight. However, due to its cruiser nature, the bike is on the heavier side and also gets a stiff ride quality.
m8p2 = Price: Royal Enfield Super Meteor 650 price for its variant - Super Meteor 650 Astral starts at Rs. 3,63,900. The price for the other variants - Super Meteor 650 Interstellar and Super Meteor 650 Celestial are Rs. 3,79,123 and Rs. 3,94,347. The mentioned Super Meteor 650 prices are the average ex-showroom.
m9p1 = The Hunter 350 is one good looking motorcycle. It gets an engine that churns out good performance but its stiff ride quality makes it little bothersome. In terms of features, the Hunter gets the basic ones and misses out the GPS. But its high aspirational value and accessible seat height definitely makes it enticing.
m9p2 = Price: Royal Enfield Hunter 350 price for its variant - Hunter 350 Retro Factory starts at Rs. 1,49,900. The price for the other variants - Hunter 350 Metro Dapper and Hunter 350 Metro Rebel are Rs. 1,69,434 and Rs. 1,74,430. The mentioned Hunter 350 prices are the average ex-showroom.

