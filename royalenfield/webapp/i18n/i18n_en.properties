wrem = Which Royal Enfield motorcycle is perfect for me?
omdi = Our motorcycles differ in many ways as each offers a different experience, while providing the signature Royal Enfield riding pleasure. You can explore our range, book a test ride and select the motorcycle that’s best for you by walking in to a Royal Enfield store near you."
wcib = Where can I buy a Royal Enfield motorcycle from?
atw = Across the world, we have stores in over 50 countries. They are well equipped to provide you support and guidance to ride a Royal Enfield motorcycle of your choice. All you need to do is walk in to a Royal Enfield store near you.
witf = What is the frame number of my motorcycle?
tfno = The frame number of your Royal Enfield motorcycle is punched on the steering head on the right side.
wite = What is the engine number of my motorcycle?
teno = The engine number of your Royal Enfield motorcycle is punched on the left side of the crank case
saf =  Safety  
wdtw = What does the warning sign mean?
twsi = The warning sign indicates a hazardous situation. Please do not ignore this message. Consult a Royal Enfield authorized service centre immediately.
hlci = How long can I drive while the warning sign flashes?
wrty = We recommend that you do not ride the motorcycle and show it to the nearest Royal Enfield authorized service center at the earliest.
watc = What are the checks that I have to do before I start my motorcycle?
cftp = Check for the petrol levels and or any kind of leakage. Check for play in the front and rear brake levels. Check the steering for free motion. Check operation of all electrical equipment. Check if the engine oil levels are between MAX and MIN. Start the engine, run it for 2 minutes before checking the engine oil. For all queries, we recommend you visit a Royal Enfield authorized service center.
witft = What is the fastest that I can ride my motorcycle?
wrtyd = We recommend that you don’t ride over 60kmph until the first 500kms of your bike and over 70kmph until the first 2000kms
itac = Is there a customer service number that I can call for any assistance?
frar = For Roadside Assistance (RSA) (1800 2100 007) for availing RSA Assistance. For Customer Support (1800 2100 008) for availing Customer Support.
wwre = When was Royal Enfield established?
tecc = The Enfield Cycle Company made motorcycles, bicycles, lawnmowers, and stationary engines under the name Royal Enfield...
ware = Where are Royal Enfield’s factories based?
trep = The Royal Enfield primary factory is located in the Chennai suburb of Oragadam. The secondary factory is located in nearby place called Vallam Vadagal.
