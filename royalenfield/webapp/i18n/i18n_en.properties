aboutUs=About Us
aboutUsDescription=Explore our journey, vision, and commitment
AboutUsSubHeader=Powered by Innovate
theEarlyYears = THE EARLY YEARS
tey = When the first Royal Enfield motorcycle rolled out in 1901, it was the beginning of an endearing story that would turn into a legend by the turn of the century. Aptly christened - Made Like a Gun - the phrase epitomizes the simple, resilient, and dependable machines that have stood the test of time and terrain. It continues to be one of the key inspirations for everything that Royal Enfield builds.
THEINDIANCONNECTION = THE INDIAN CONNECTION
theBritish = The British roots of Royal Enfield got an Indian soul in 1955, when Madras Motors started manufacturing the motorcycles in Chennai. Six decades later, it has led the leisure motorcycling culture in India from the front. The iconic motorcycles have been accomplices to a thousand adventures and the dependable steed of the men in uniform. The upbeat response to the latest models is testimony to the fact that motorcycles are still trusted, loved and rode upon.
thePersuit = THE PURSUIT OF EXPLORATION
theForty = The forty bravehearts who rode their Royal Enfields to Khardung-la for the first time in 1997, set off a culture of explorations. Since then, Royal Enfield motorcycles have been allies to many such epic trips. This active pursuit to ride to new places, in a simple and unhurried manner, is what makes for Royal Enfield’s purpose of delivering pure motorcycling experience.
inspiredb = INSPIRED BY A MOTORCYCLING WAY OF LIFE
wfre = When the first Royal Enfield motorcycle rolled out in 1901, it was the beginning of an endearing story that would turn into a legend by the turn of the century. Aptly christened - Made Like a Gun - the phrase epitomize the simple, resilient and dependable machines that have stood the test of time and terrain. It continues to be one of the key inspirations for everything that Royal Enfield builds.

