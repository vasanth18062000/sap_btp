wrem = ¿Qué motocicleta Royal Enfield es perfecta para mí?
omdi = Nuestras motocicletas se diferencian en muchos aspectos, ya que cada una ofrece una experiencia diferente y, al mismo tiempo, brinda el placer de conducción característico de Royal Enfield. Puede explorar nuestra gama, reservar una prueba de manejo y seleccionar la motocicleta que mejor se adapte a sus necesidades visitando una tienda Royal Enfield cercana.
wcib = ¿Dónde puedo comprar una motocicleta Royal Enfield?
atw = Contamos con tiendas en más de 50 países de todo el mundo. Están bien equipadas para brindarte apoyo y orientación para conducir la motocicleta Royal Enfield que elijas. Todo lo que necesitas hacer es acercarte a una tienda Royal Enfield cercana.
witf = ¿Cuál es el número de bastidor de mi motocicleta?
tfno = El número de bastidor de su motocicleta Royal Enfield está grabado en el cabezal de dirección, en el lado derecho.
wite = ¿Cual es el número de motor de mi motocicleta?
teno = El número de motor de su motocicleta Royal Enfield está grabado en el lado izquierdo del cárter.
saf =  Seguridad  
wdtw = ¿Qué significa la señal de advertencia?
twsi = La señal de advertencia indica una situación peligrosa. No ignore este mensaje. Consulte inmediatamente con un centro de servicio autorizado de Royal Enfield.
hlci = ¿Cuánto tiempo puedo conducir mientras la señal de advertencia parpadea?
wrty = Le recomendamos que no conduzca la motocicleta y la muestre al centro de servicio autorizado Royal Enfield más cercano lo antes posible.
watc = ¿Cuáles son las comprobaciones que debo hacer antes de arrancar mi moto?
cftp = Compruebe los niveles de gasolina y/o cualquier tipo de fuga. Compruebe si hay juego en los niveles de los frenos delanteros y traseros. Compruebe que la dirección se mueva libremente. Compruebe el funcionamiento de todos los equipos eléctricos. Compruebe que los niveles de aceite del motor estén entre MAX y MINI. Arranque el motor y déjelo funcionar durante 2 minutos antes de comprobar el aceite del motor. Para todas las consultas, le recomendamos que visite un centro de servicio autorizado de Royal Enfield.
witft = ¿Cuál es la velocidad máxima a la que puedo ir en mi motocicleta?
wrtyd = Te recomendamos que no conduzcas a más de 60 km/h hasta los primeros 500 km de tu bicicleta y a más de 70 km/h hasta los primeros 2000 km.
itac = ¿Existe un número de atención al cliente al que pueda llamar para solicitar ayuda?
frar = Para asistencia en carretera (RSA) (1800 2100 007) para obtener asistencia de RSA. Para atención al cliente (1800 2100 008) para obtener asistencia al cliente.
