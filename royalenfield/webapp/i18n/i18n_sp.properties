m1p1 = La versión bobber de la siempre popular Classic 350 parece bastante atractiva y su diseño es uno de sus mayores atractivos.
m1p2 = La Royal Enfield Goan Classic 350 se lanzará en la India en unos días. Royal Enfield anunciará los precios el 23 de noviembre después de presentar la motocicleta en Motoverse 2024.
m2p1 = Precio: El precio de la Royal Enfield Bear 650 para su variante - Bear 650 Broadwalk White comienza en Rs. 3,39,000. El precio de las otras variantes - Bear 650 Petrol Green y Wild Honey, Bear 650 Golden Shadow y Bear 650 Two Four Nine son Rs. 3,44,000, Rs. 3,51,000 y Rs. 3,59,000. Los precios mencionados de la Bear 650 son los precios promedio ex-showroom.
m2p2 = Royal Enfield ha comenzado las entregas de una de sus últimas novedades, la Bear 650, en toda la India. La versión scrambler de la Interceptor 650 se lanzó el 5 de noviembre.
m3p1 = La nueva Classic 350 ha llevado las cosas a un nivel completamente nuevo. Ahora se ve mucho mejor. El motor produce un buen rendimiento y conserva el carácter. Se maneja bien y logra brindar una agradable experiencia de conducción tanto en ciudad como en carretera. Pero la calidad de conducción es un poco más rígida, lo que podría resultar un problema en la conducción urbana. Además, los precios han aumentado bastante.
m3p2 = Precio: El precio de la Royal Enfield Classic 350 para su variante, Classic 350 Heritage, comienza en Rs. 1,99,499. El precio de las otras variantes, Classic 350 Heritage Premium, Classic 350 Signals, Classic 350 Dark y Classic 350 Chrome, es de Rs. 2,03,992, Rs. 2,16,000, Rs. 2,25,000 y Rs. 2,30,000. Los precios mencionados de la Classic 350 son los precios promedio ex-showroom.
m4p1 = La Royal Enfield Guerrilla 450 es una moto disponible en 3 variantes y 5 colores. La Royal Enfield Guerrilla 450 está propulsada por un motor BS6 de 452 cc que desarrolla una potencia de 39,47 CV y ​​un par motor de 40 Nm. Con frenos de disco delanteros y traseros, la Royal Enfield Guerrilla 450 viene con un sistema de frenos antibloqueo. Esta moto Guerrilla 450 pesa 185 kg y tiene una capacidad de depósito de combustible de 11 litros.
m4p2 = Precio: El precio de la Royal Enfield Guerrilla 450 para su variante Guerrilla 450 Analogue comienza en Rs. 2,39,000. El precio de las otras variantes, Guerrilla 450 Dash y Guerrilla 450 Flash, es de Rs. 2,49,000 y Rs. 2,54,000. Los precios mencionados de la Guerrilla 450 son los precios promedio ex-showroom.
m5p1 = La Royal Enfield Shotgun 650 es una cruiser disponible en 3 variantes y 4 colores. La Royal Enfield Shotgun 650 está propulsada por un motor BS6 de 648 cc que desarrolla una potencia de 46,39 CV y ​​un par de 52,3 Nm. Con frenos de disco delanteros y traseros, la Royal Enfield Shotgun 650 viene con un sistema de frenos antibloqueo. Esta moto Shotgun 650 pesa 240 kg y tiene una capacidad de depósito de combustible de 13,8 litros.
m5p2 = Precio: El precio de la Royal Enfield Shotgun 650 para su variante, Shotgun 650 Custom Shed, comienza en Rs. 3,59,430. El precio de las otras variantes, Shotgun 650 Custom Pro y Shotgun 650 Custom Special, es Rs. 3,70,138 y Rs. 3,73,000. Los precios mencionados de la Shotgun 650 son los precios promedio ex-showroom.
m6p1 = La Himalayan 452 es la sucesora de la Himalayan 411 y es conocida por sus excelentes capacidades todoterreno y su fantástico comportamiento en carretera. También incluye una pantalla TFT a todo color con integración de Google Maps. Sin embargo, la bicicleta carece de ruedas de radios sin cámara y también presenta algunos problemas de calidad.
m6p2 = Precio: El precio de la Royal Enfield Himalayan 450 para su variante, Himalayan 450 Base, comienza en Rs. 2,85,000. El precio de las otras variantes, Himalayan 450 Pass, Himalayan 450 Summit y Himalayan 450 Hanle Black, es de Rs. 2,89,000, Rs. 2,93,000 y Rs. 2,98,000. Los precios mencionados de la Himalayan 450 son los precios promedio ex-showroom.
m7p1 = La Royal Enfield Bullet 350 es una moto de calle disponible en 5 variantes y 7 colores. La Royal Enfield Bullet 350 está propulsada por un motor BS6 de 349 cc que desarrolla una potencia de 20,2 CV y ​​un par de 27 Nm. Con frenos de disco delanteros y de tambor traseros, la Royal Enfield Bullet 350 viene con un sistema de frenos antibloqueo. Esta moto Bullet 350 pesa 195 kg y tiene una capacidad de depósito de combustible de 13 litros.
m7p2 = Precio: El precio de la Royal Enfield Bullet 350 para su variante - Bullet 350 Base comienza en Rs. 1,73,562. El precio de las otras variantes - Bullet 350 Battalion Black, Bullet 350 Military Silver, Bullet 350 Mid y Bullet 350 Top son Rs. 1,74,875, Rs. 1,79,000, Rs. 1,97,436 y Rs. 2,15,801. Los precios mencionados de la Bullet 350 son los precios promedio ex-showroom.
m8p1 = La Super Meteor 650 es una cruiser de verdad que tiene un estilo ambicioso, un buen nivel de confort y un motor que ofrece un gran rendimiento. También está repleta de características modernas. De hecho, esta moto tiene un faro LED. Sin embargo, debido a su naturaleza cruiser, la moto es más bien pesada y también tiene una conducción rígida.
m8p2 = Precio: El precio de la Royal Enfield Super Meteor 650 para su variante, Super Meteor 650 Astral, comienza en Rs. 3,63,900. El precio de las otras variantes, Super Meteor 650 Interstellar y Super Meteor 650 Celestial, es Rs. 3,79,123 y Rs. 3,94,347. Los precios mencionados de la Super Meteor 650 son los precios promedio ex-showroom.
m9p1 = La Hunter 350 es una motocicleta muy atractiva. Tiene un motor que produce un buen rendimiento, pero su conducción rígida la hace un poco molesta. En términos de características, la Hunter tiene las básicas y no tiene GPS. Pero su alto valor aspiracional y la altura accesible del asiento definitivamente la hacen atractiva.
m9p2 = Precio: El precio de la Royal Enfield Hunter 350 para su variante, Hunter 350 Retro Factory, comienza en Rs. 1,49,900. El precio de las otras variantes, Hunter 350 Metro Dapper y Hunter 350 Metro Rebel, es Rs. 1,69,434 y Rs. 1,74,430. Los precios mencionados de la Hunter 350 son los precios promedio ex-showroom.

