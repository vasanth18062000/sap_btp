#About Us
aboutUs=Sobre nosotros
aboutUsDescription=Explore nuestra trayectoria, visión y compromiso para ofrecer excelencia.
AboutUsSubHeader=Desarrollado por Innovate
theEarlyYears = LOS PRIMEROS AÑOS
tey = Cuando en 1901 se presentó la primera motocicleta Royal Enfield, empezó una historia entrañable que se convertiría en leyenda a finales del siglo XX. Bautizada acertadamente como "Made Like a Gun", la frase representa las máquinas sencillas, resistentes y fiables que han resistido la prueba del tiempo y el terreno. Sigue siendo una de las principales inspiraciones para todo lo que fabrica Royal Enfield.
THEINDIANCONNECTION = LA CONEXIÓN INDIA
theBritish = Las raíces británicas de Royal Enfield adquirieron un alma india en 1955, cuando Madras Motors comenzó a fabricar motocicletas en Chennai. Seis décadas después, ha liderado la cultura del motociclismo recreativo en la India desde el frente. Las icónicas motocicletas han sido cómplices de miles de aventuras y el corcel confiable de los hombres de uniforme. La respuesta optimista a los últimos modelos es testimonio del hecho de que las motocicletas aún son confiables, queridas y conducidas.
thePersuit = LA BÚSQUEDA DE LA EXPLORACIÓN
theForty = Los cuarenta valientes que viajaron por primera vez en sus Royal Enfield a Khardung-la en 1997 dieron inicio a una cultura de exploración. Desde entonces, las motocicletas Royal Enfield han sido aliadas de muchos de esos viajes épicos. Esta búsqueda activa de nuevos lugares, de una manera sencilla y sin prisas, es lo que hace que el propósito de Royal Enfield sea ofrecer una experiencia de motociclismo pura.
inspiredb = INSPIRADO POR UNA FORMA DE VIDA MOTOCICLISTA
wfre = Cuando en 1901 se presentó la primera motocicleta Royal Enfield, empezó una historia entrañable que se convertiría en leyenda a finales del siglo XX. Bautizada acertadamente como "Made Like a Gun", la frase resume las máquinas sencillas, resistentes y fiables que han superado la prueba del tiempo y el terreno. Sigue siendo una de las principales inspiraciones para todo lo que fabrica Royal Enfield.

